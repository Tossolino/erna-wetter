# Baut die Android-App (Erna) und stellt sie als Download bereit:
# https://github.com/Tossolino/erna-wetter/releases/latest/download/erna-app.apk
name: Android-App bauen

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: App bauen
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Version lesen
        id: v
        run: echo "version=$(cat android/VERSION)" >> "$GITHUB_OUTPUT"

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk erna-app.apk

      - name: Als Download veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ steps.v.outputs.version }}
          name: Erna-App ${{ steps.v.outputs.version }}
          body: |
            Erna-App ${{ steps.v.outputs.version }} für Android (ab Android 8).
            Installation: erna-app.apk auf dem Handy herunterladen und öffnen.
          files: erna-app.apk
          make_latest: true
